# YouTube Filter Store - tüm bileşenler Docker'da çalışır
# Kullanım: cp .env.example .env && docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
    volumes:
      - db_verisi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-store}
      OTURUM_GIZLI_ANAHTAR: ${OTURUM_GIZLI_ANAHTAR:?OTURUM_GIZLI_ANAHTAR .env dosyasında tanımlanmalı}
      ILK_ADMIN_KULLANICI: ${ILK_ADMIN_KULLANICI:-admin}
      ILK_ADMIN_SIFRE: ${ILK_ADMIN_SIFRE:-}
      GUVENLI_CEREZ: ${GUVENLI_CEREZ:-false}
    ports:
      - "${STORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saglik').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_verisi:
