<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="akis-title akis-desc">
  <title id="akis-title">Karar akışı</title>
  <desc id="akis-desc">YouTube sayfası ve Filter Store'dan gelen db.json verisi YT Filtreleyici'de birleşir. Tarayıcı içinde verilen karar gizle, bulanıklaştır veya uyarı sayfası olarak uygulanır.</desc>

  <rect width="1200" height="360" rx="26" fill="#F7F3EB"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#E3DCCF"/>

  <g id="akis-baslik">
    <text x="64" y="60" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" font-weight="600" letter-spacing="2.4" fill="#C9342B">KARAR AKIŞI</text>
    <text x="64" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="-0.6" fill="#171A1C">Veri topluluktan, karar tarayıcıda.</text>
    <circle cx="952" cy="96" r="5" fill="#1E6B52"/>
    <text x="966" y="102" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.2" fill="#6B6861">AĞ İSTEĞİ YOK</text>
  </g>

  <g id="kaynaklar">
    <g transform="translate(64 150)">
      <rect width="248" height="76" rx="14" fill="#FFFDF8" stroke="#E3DCCF"/>
      <rect x="18" y="20" width="44" height="32" rx="8" fill="#C9342B"/>
      <path d="M34 28L50 36L34 44Z" fill="#FFFDF8"/>
      <text x="78" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#171A1C">YouTube sayfası</text>
      <text x="78" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#6B6861">ana sayfa · arama · kanal</text>
    </g>

    <g transform="translate(64 250)">
      <rect width="248" height="84" rx="14" fill="#171A1C"/>
      <g transform="translate(18 24) scale(0.26)">
        <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" fill="#C9342B"/>
        <path d="M8 22C24 19 44 14 64 6V64H8V22Z" fill="#F3EFE7"/>
        <path d="M64 64H120V58C120 91 99 112 64 124V64Z" fill="#F3EFE7"/>
        <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" fill="none" stroke="#F3EFE7" stroke-width="8" stroke-linejoin="round"/>
      </g>
      <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#F3EFE7">Filter Store</text>
      <text x="66" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#A7A39B">anonim oy · moderasyon</text>
    </g>
  </g>

  <g id="filtre-karti">
    <rect x="432" y="150" width="280" height="184" rx="18" fill="#C9342B"/>
    <text x="460" y="184" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#F3EFE7" fill-opacity="0.78">TARAYICI İÇİ</text>
    <text x="460" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="-0.5" fill="#FFFDF8">YT Filtreleyici</text>
    <text x="460" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#F3EFE7">konu + etiket</text>
    <text x="460" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#F3EFE7" fill-opacity="0.8">karar sayfada verilir</text>
    <g transform="translate(642 274) scale(0.32)" opacity="0.18">
      <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" fill="none" stroke="#FFFDF8" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="baglantilar" fill="none" stroke="#C9342B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 188H420"/>
    <path d="M408 179L420 188L408 197"/>

    <path d="M312 292H420" stroke-dasharray="7 7"/>
    <path d="M408 283L420 292L408 301"/>

    <path d="M712 241H790"/>
    <path d="M790 189V293"/>
    <path d="M790 189H808"/>
    <path d="M808 180L820 189L808 198"/>
    <path d="M790 241H808"/>
    <path d="M808 232L820 241L808 250"/>
    <path d="M790 293H808"/>
    <path d="M808 284L820 293L808 302"/>
  </g>

  <g id="baglanti-etiketleri" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#6B6861">
    <text x="330" y="176">sayfa</text>
    <g transform="translate(324 266)">
      <rect width="76" height="24" rx="6" fill="#FFFDF8" stroke="#E3DCCF"/>
      <text x="12" y="17" fill="#171A1C">db.json</text>
    </g>
    <text x="724" y="229">karar</text>
  </g>

  <g id="ciktilar">
    <g transform="translate(820 168)">
      <rect width="252" height="42" rx="10" fill="#171A1C"/>
      <g transform="translate(18 11)" fill="none" stroke="#F3EFE7" stroke-width="1.8" stroke-linecap="round">
        <path d="M2 10C5 5 15 5 18 10C15 15 5 15 2 10Z"/>
        <circle cx="10" cy="10" r="3"/>
        <path d="M3 17L17 3"/>
      </g>
      <text x="46" y="28" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="0.6" fill="#F3EFE7">GİZLE</text>
    </g>

    <g transform="translate(820 220)">
      <rect width="252" height="42" rx="10" fill="#C9342B"/>
      <g transform="translate(18 11)" fill="#F3EFE7">
        <circle cx="7" cy="10" r="4" fill-opacity="0.4"/>
        <circle cx="11" cy="10" r="4" fill-opacity="0.7"/>
        <circle cx="15" cy="10" r="4"/>
      </g>
      <text x="46" y="28" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="0.6" fill="#FFFDF8">BULANIKLAŞTIR</text>
    </g>

    <g transform="translate(820 272)">
      <rect width="252" height="42" rx="10" fill="#E9B45C"/>
      <g transform="translate(18 11)" fill="none" stroke="#171A1C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M10 2L19 18H1Z"/>
        <path d="M10 8V12"/>
        <circle cx="10" cy="15.2" r="1.1" fill="#171A1C" stroke="none"/>
      </g>
      <text x="46" y="28" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="0.6" fill="#171A1C">UYARI SAYFASI</text>
    </g>
  </g>
</svg>
