<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="b3-title b3-desc">
  <title id="b3-title">03 — Geliştirme</title>
  <desc id="b3-desc">Tek depoda iki parça: uzantı ve site. Sağda npm run build ve build:check komutlarını gösteren bir terminal.</desc>

  <rect width="1200" height="132" rx="22" fill="#C9342B"/>
  <rect x="1" y="1" width="1198" height="130" rx="21" fill="none" stroke="#98251F"/>

  <text x="64" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#F3EFE7">03</text>
  <rect x="150" y="28" width="2" height="76" fill="#F3EFE7" fill-opacity="0.28"/>
  <text x="182" y="40" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="600" letter-spacing="2.2" fill="#E9B45C">KAYNAK</text>
  <text x="182" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="-0.4" fill="#F3EFE7">İki parça, tek depo.</text>
  <text x="182" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#F3EFE7" fill-opacity="0.9">Testler, tip denetimi ve derleme.</text>

  <g transform="translate(864 26)">
    <rect width="272" height="80" rx="12" fill="#171A1C" stroke="#F3EFE7" stroke-opacity="0.2"/>
    <circle cx="18" cy="16" r="3" fill="#F2635A"/>
    <circle cx="30" cy="16" r="3" fill="#E9B45C"/>
    <circle cx="42" cy="16" r="3" fill="#63C9A8"/>
    <text x="18" y="50" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" font-weight="600" fill="#E9B45C">$</text>
    <text x="36" y="50" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#F3EFE7">npm run build</text>
    <rect x="172" y="37" width="8" height="14" fill="#F3EFE7" fill-opacity="0.55"/>
    <text x="18" y="70" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#63C9A8">✓ build:check</text>
  </g>
</svg>
