<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">YouTube Filtreleyici</title>
  <desc id="hero-desc">Topluluk verisiyle çalışan, Chromium ve Firefox için konu ve etiket tabanlı yerel YouTube filtresi. Marka kalkanı; spor, teknoloji, haber ve müzik etiketleriyle çevrilidir.</desc>

  <defs>
    <radialGradient id="isik" cx="78%" cy="44%" r="62%">
      <stop offset="0" stop-color="#262B2F"/>
      <stop offset="1" stop-color="#171A1C"/>
    </radialGradient>
    <clipPath id="kalkan-kirp">
      <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#171A1C"/>
  <rect width="1200" height="400" rx="28" fill="url(#isik)"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#F3EFE7" stroke-opacity="0.12"/>

  <!-- Sol blok: kimlik ve vaat -->
  <g id="baslik">
    <rect x="64" y="66" width="34" height="4" rx="2" fill="#F2635A"/>
    <text x="64" y="104" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="600" letter-spacing="2.6" fill="#E9B45C">TOPLULUK VERİSİYLE · TARAYICI İÇİ</text>
    <text x="60" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" letter-spacing="-2.4" fill="#F3EFE7">YouTube</text>
    <text x="60" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" letter-spacing="-2.4" fill="#F2635A">Filtreleyici</text>
    <text x="64" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" fill="#CFC8BC">Konu ve etiket filtreleri Chromium ve Firefox'ta</text>
    <text x="64" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" fill="#CFC8BC">yerel çalışır. Veriyi anonim oylar üretir.</text>
    <g transform="translate(64 368)">
      <rect x="0" y="-13" width="3" height="18" fill="#F2635A"/>
      <text x="16" y="0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#9A948A">v2.1.0  ·  CHROMIUM + FIREFOX  ·  APACHE-2.0</text>
    </g>
  </g>

  <!-- Sağ blok: marka kalkanı ve etiket evreni -->
  <g id="kalkan-alani">
    <circle cx="935" cy="194" r="160" fill="none" stroke="#F3EFE7" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="3 11"/>
    <g fill="#E9B45C">
      <circle cx="1095" cy="194" r="4"/>
      <circle cx="1015" cy="333" r="4"/>
      <circle cx="855" cy="333" r="4"/>
      <circle cx="775" cy="194" r="4"/>
      <circle cx="855" cy="55" r="4"/>
      <circle cx="1015" cy="55" r="4"/>
    </g>

    <g transform="translate(710 84) rotate(-8)">
      <rect width="112" height="40" rx="10" fill="#E9B45C"/>
      <circle cx="18" cy="20" r="4" fill="#171A1C"/>
      <text x="30" y="26" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2" fill="#171A1C">SPOR</text>
    </g>

    <g transform="translate(1010 66) rotate(6)">
      <rect width="176" height="42" rx="10" fill="#F3EFE7"/>
      <circle cx="18" cy="21" r="4" fill="#C9342B"/>
      <text x="30" y="27" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2" fill="#171A1C">TEKNOLOJİ</text>
    </g>

    <g transform="translate(702 224) rotate(-4)">
      <rect width="120" height="40" rx="10" fill="#24282C" stroke="#F3EFE7" stroke-opacity="0.2"/>
      <circle cx="18" cy="20" r="4" fill="#F2635A"/>
      <text x="30" y="26" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2" fill="#F3EFE7">HABER</text>
    </g>

    <g transform="translate(1060 220) rotate(7)">
      <rect width="120" height="40" rx="10" fill="#C9342B"/>
      <circle cx="18" cy="20" r="4" fill="#F3EFE7"/>
      <text x="30" y="26" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2" fill="#FFFDF8">MÜZİK</text>
    </g>

    <g transform="translate(935 196) rotate(-7)">
      <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" transform="translate(9 11) scale(2.15) translate(-64 -64)" fill="#C9342B" opacity="0.38"/>
      <g transform="scale(2.15) translate(-64 -64)">
        <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" fill="#C9342B"/>
        <g clip-path="url(#kalkan-kirp)">
          <path d="M8 22C24 19 44 14 64 6V64H8V22Z" fill="#F3EFE7"/>
          <path d="M64 64H120V58C120 91 99 112 64 124V64Z" fill="#F3EFE7"/>
        </g>
        <path d="M64 6C84 14 104 19 120 22V58C120 91 99 112 64 124C29 112 8 91 8 58V22C24 19 44 14 64 6Z" fill="none" stroke="#F3EFE7" stroke-width="4.5" stroke-linejoin="round"/>
      </g>
    </g>

    <g transform="translate(840 342)">
      <rect width="190" height="32" rx="16" fill="#1E2326" stroke="#F3EFE7" stroke-opacity="0.14"/>
      <circle cx="18" cy="16" r="4" fill="#63C9A8"/>
      <text x="32" y="21" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.2" fill="#CFC8BC">VERİ YERELDE</text>
    </g>
  </g>
</svg>
